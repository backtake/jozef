spring:
  application:
    name: jozef-test
    version: test
  main:
    web-application-type: none
    headless: false

jozef:
  llm:
    provider: ollama
    model: llama3.2
    endpoint: http://localhost:11434
    temperature: 0.7
    max-tokens: 2048
    fallback:
      provider: deepseek
      model: deepseek-chat
      endpoint: ""
      api-key-env: DEEPSEEK_API_KEY
  speech:
    tts:
      provider: console
  automation:
    platform: windows
