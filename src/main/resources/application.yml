spring:
  application:
    name: life-eta-engine
  profiles:
    active: dev

  datasource:
    url: jdbc:sqlite:data/lifeeta.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
