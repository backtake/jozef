spring:
  application:
    name: jozef
    version: 0.1.0
  main:
    web-application-type: none
    headless: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration

jozef:
  # ─── LLM ────────────────────────────────────────────
  llm:
    # auto = najlepszy dostępny: OpenAI (gdy jest OPENAI_API_KEY) → DeepSeek (DEEPSEEK_API_KEY) → lokalna Ollama.
    # Małe modele lokalne (llama3.2 3B) słabo radzą sobie z narzędziami i polskim — stąd chmura, gdy jest klucz.
    provider: auto                 # auto | openai | deepseek | ollama
    model: ""                      # puste = domyślny providera (openai: gpt-4.1-mini, deepseek: deepseek-chat, ollama: llama3.2)
    endpoint: ""                   # puste = domyślny providera (ollama: http://localhost:11434)
    api-key-env: ""                # nazwa zmiennej środowiskowej z kluczem (puste = standardowa dla providera)
    temperature: 0.4
    max-tokens: 1024
    timeout-seconds: 90
    fallback:                      # używany automatycznie, gdy główny model zawiedzie
      provider: ollama
      model: llama3.2
      endpoint: http://localhost:11434

  # ─── Persona ────────────────────────────────────────
  persona:
    name: Jozef
    language: pl
    style: concise

  # ─── Agent loop ─────────────────────────────────────
  agent:
    max-tool-calls-per-turn: 5
    tool-timeout-seconds: 30

  # ─── Speech ─────────────────────────────────────────
  speech:
    stt:
      provider: vosk              # vosk | console
      model: data/vosk-model-small-pl-0.22   # ścieżka do rozpakowanego modelu Vosk
      auto-download: true         # pobierz i zainstaluj model automatycznie przy starcie
    tts:
      provider: auto              # auto (OpenAI gdy jest OPENAI_API_KEY, inaczej Windows) | openai | windows | console
      voice: ash                  # głos OpenAI: ash | onyx | nova | coral | sage | alloy …
    vad:
      enabled: true
      sensitivity: medium          # low | medium | high

  # ─── Overlay ────────────────────────────────────────
  overlay:
    enabled: true
    position: top-right            # top-left | top-right | bottom-left | bottom-right | center
    opacity: 0.9
    timeout-ms: 5000

  # ─── Wake Word ──────────────────────────────────────
  wakeword:
    enabled: true
    word: "hej jozef"

  # ─── Automation ─────────────────────────────────────
  automation:
    platform: windows              # windows | linux | mac
    mouse-speed: 1.0
    typing-speed: 1.0

  # ─── Browser (Playwright) ───────────────────────────
  browser:
    enabled: true
    headless: false                # true = ukryta przeglądarka
    channel: chrome                # chrome | msedge | (puste = bundled chromium)
    profile-dir: ""                # opcjonalny trwały profil (zalogowane sesje)
    executable-path: ""            # ścieżka do binary (np. Brave) — nadpisuje channel

  # ─── Google (OAuth + Calendar + Gmail) ────────────────
  google:
    enabled: true
    tokens-file: data/google-tokens.json   # zapisane tokeny OAuth (git-ignored)
    calendar-id: primary
    credentials-file: data/google-credentials.json  # JSON pobrany z Google Cloud Console
    authenticate-on-startup: true          # przy starcie otwórz logowanie Google w przeglądarce
    # client-id / client-secret są czytane w kolejności:
    #   1. GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (env)
    #   2. pola client-id / client-secret poniżej (tylko dev, nie commitować)
    #   3. credentials-file (JSON z Google Cloud Console)

  # ─── Security ─────────────────────────────────────
  security:
    confirmation-provider: conversation # conversation (tak/nie w rozmowie) | console | auto-deny

  # ─── Plugins ────────────────────────────────────────
  plugins:
    auto-discover: true
    directories:
      - plugins/
    disabled: []                   # list of disabled plugins

  # ─── Memory ─────────────────────────────────────────
  memory:
    conversation-max-turns: 50     # history turns sent to the LLM
    working-memory-size: 10        # long-term notes injected into context
    file: data/memory.json         # persistent long-term memory store
    vector-store:
      enabled: false
      provider: qdrant             # qdrant | chroma | pgvector

  # ─── Tray / startup / hotkey ──────────────────────
  tray:
    enabled: true
    autostart: false               # true = dodaj do autostartu Windows (HKCU Run)
    hotkey: "ctrl alt J"           # globalny hotkey; "" = wyłączony

  # ─── Proactive (timers + watchers) ────────────────
  proactive:
    enabled: true
    calendar-poll-minutes: 5       # jak często sprawdzać kalendarz
    gmail-poll-minutes: 5          # jak często sprawdzać Gmaila
    calendar-lookahead-minutes: 15 # przypominaj o wydarzeniach za <15 min

  # ─── Planning (autonomous execution) ──────────────
  planning:
    enabled: false                 # pętla agenta sama planuje wieloetapowo; osobny planner dubluje ją i zwiększa ryzyko/koszt
    max-attempts: 3                # ile razy replanować po błędzie
    file: data/plans.json          # trwały zapis planów (przetrwają restart)

  # ─── Telefon (prywatny bot Telegram) ──────────────
  # 1) W Telegramie napisz do @BotFather: /newbot → dostaniesz token.
  # 2) Ustaw zmienną środowiskową TELEGRAM_BOT_TOKEN=<token> (nigdy nie wpisuj tokenu tutaj).
  # 3) Uruchom Jozefa, napisz do swojego bota — odpisze Twoim chat id. Wpisz go niżej i uruchom ponownie.
  telegram:
    enabled: true                  # bez tokenu i tak nic nie robi
    token-env: TELEGRAM_BOT_TOKEN
    allowed-chat-ids: []           # np. [123456789] — tylko te czaty mogą wydawać polecenia

  # ─── Runtime ────────────────────────────────────────
  runtime:
    event-bus:
      thread-pool-size: 4
    health:
      enabled: true
      check-interval-seconds: 30

logging:
  level:
    com.jozef: INFO
    com.jozef.core: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%-18thread] %-5level %logger{20} - %msg%n"
